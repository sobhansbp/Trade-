# Hourly demo (paper) trading run. Results are committed to journal/ —
# open journal/STATUS.md on GitHub to follow the account.
#
# Setup (repo Settings -> Secrets and variables -> Actions -> New repository secret):
#   GROQ_API_KEY        required for AI news analysis / desk (optional: runs without AI)
#   TELEGRAM_BOT_TOKEN  optional, for trade alerts
#   TELEGRAM_CHAT_ID    optional
name: paper-trading

on:
  schedule:
    - cron: "7 * * * 0-5"      # every hour at :07 UTC, Sunday-Friday (FX/gold trading week)
  workflow_dispatch: {}         # "Run workflow" button for a manual cycle

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Run one live cycle (paper account, no broker orders)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA="--summary"; fi
          python -m aitrader live EURUSD XAUUSD --once --ai --news-every 3 $EXTRA

      - name: Commit journal
        run: |
          git config user.name "aitrader-bot"
          git config user.email "aitrader-bot@users.noreply.github.com"
          git add journal
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "paper: cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
